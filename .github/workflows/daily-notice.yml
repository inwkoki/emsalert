# Backstop and watchdog for the daily LINE notice.
#
# The notice is SENT by pg_cron inside Supabase, which fires at 08:00 Bangkok to
# the minute. GitHub's scheduler cannot be trusted with that job — it ran 4h30m
# late two days running and dropped half its entries — but it is fine for this,
# because checking does not need to be punctual.
#
# Calling /daily-notice is both the check and the repair: if pg_cron already
# sent today's notice this skips, and if pg_cron failed this sends it. Either
# way the group gets exactly one message, because the Bangkok date is a primary
# key on the server.
#
# A backstop that had to step in means the primary schedule is broken, so the
# run FAILS on purpose — that is what turns it into an email.
name: Daily LINE notice (backstop)

on:
  schedule:
    - cron: '0 4 * * 1-5' # nominally 11:00 Bangkok; late is fine, that is the point
  workflow_dispatch:
    inputs:
      ignore_window:
        description: 'Ignore the run window (for testing)'
        type: boolean
        default: false

concurrency: daily-line-notice

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Check today's notice went out
        shell: bash
        env:
          API: https://mvagebjizddemohhelta.supabase.co/functions/v1/api
          ACCESS_TOKEN: ${{ secrets.ONCALL_ACCESS_TOKEN }}
          FIRST_DAY: '2026-09-07'
          LAST_DAY: '2026-09-18'
          IGNORE_WINDOW: ${{ inputs.ignore_window }}
        run: |
          set -euo pipefail
          echo "UTC now:     $(date -u '+%F %H:%M')"
          echo "Bangkok now: $(TZ=Asia/Bangkok date '+%F %H:%M')"

          today=$(TZ=Asia/Bangkok date +%F)
          if [[ "$IGNORE_WINDOW" != "true" ]]; then
            if [[ "$today" < "$FIRST_DAY" || "$today" > "$LAST_DAY" ]]; then
              echo "Outside the run window ($FIRST_DAY .. $LAST_DAY) — nothing to check."
              exit 0
            fi
          fi

          # No message in the body: the text lives in DAILY_NOTICE_MESSAGE on the
          # server, so there is only ever one copy of it.
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "$API/daily-notice" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"not_before_hour":8}')

          echo "HTTP $code"; cat response.json; echo
          [[ "$code" == "200" ]]

          if grep -q '"skipped":"already sent today"' response.json; then
            echo "✓ pg_cron sent today's notice. Nothing to do."
            exit 0
          fi

          if grep -q '"sent":true' response.json; then
            echo "::error::pg_cron did NOT send today's notice — this backstop sent it late."
            echo "Check Supabase: select * from cron.job_run_details order by start_time desc limit 10;"
            exit 1
          fi

          echo "Notice not sent and not due (probably before 08:00 Bangkok)."
