services:
  - type: web
    name: emsalert-api
    runtime: node
    plan: starter          # free tier sleeps after ~15 min idle; starter stays warm
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_GROUP_ID
        sync: false
      - key: ACCESS_TOKEN
        sync: false
      - key: TRIGGER_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: ACK_MESSAGE
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
